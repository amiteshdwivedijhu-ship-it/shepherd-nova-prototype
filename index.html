<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nova · Autonomy decision — Shepherd</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="assets/shepherd-wordmark.svg" alt="Shepherd" class="wordmark">
    <span class="divider"></span>
    <span class="product"><span class="product-dot" aria-hidden="true"></span>Nova <span class="product-sub">Autonomy decision</span></span>
  </div>
  <div class="topbar-right">
    <span class="env-chip">P&amp;C · Construction · Demo</span>
    <div class="account-switch" id="accountSwitch"></div>
  </div>
</header>

<main>
  <nav class="steps" aria-label="Walkthrough steps">
    <div class="step done"><span class="step-num">1</span>Submission packet<span class="tick" aria-hidden="true"></span></div>
    <div class="step-line" aria-hidden="true"></div>
    <div class="step done"><span class="step-num">2</span>Extract &amp; reconcile<span class="tick" aria-hidden="true"></span></div>
    <div class="step-line" aria-hidden="true"></div>
    <div class="step current"><span class="step-num">3</span>Autonomy decision</div>
  </nav>

  <div class="layout">
    <aside class="panel packet-panel" id="packetPanel" aria-label="Submission packet"></aside>
    <section class="panel facts-panel" id="factsPanel" aria-label="Extracted facts"></section>
    <aside class="panel decision-panel" id="decisionPanel" aria-label="Autonomy decision"></aside>
  </div>

  <footer class="footnote">Nova prototype · synthetic submission data · demo only</footer>
</main>

<div class="modal" id="docModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Close preview">Close</button>
    <div class="modal-head">
      <span class="doc-icon" id="modalIcon" aria-hidden="true"></span>
      <div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
    </div>
    <pre class="modal-body" id="modalBody"></pre>
    <div class="modal-foot">Synthetic stub. Nova parsed this document for the demo packet.</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
